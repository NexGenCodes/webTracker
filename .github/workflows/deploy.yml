name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Linux binary
        working-directory: backend
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bot ./cmd/server/
          ls -lh bot

      - name: Upload to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: backend/bot
          target: /tmp
          strip_components: 1

      - name: Deploy and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            echo "=== Installing binary ==="
            sudo cp /opt/webtracker/bot /opt/webtracker/bot.bak
            sudo mv /tmp/bot /opt/webtracker/bot
            sudo chmod +x /opt/webtracker/bot

            echo "=== Creating API service ==="
            sudo tee /etc/systemd/system/webtracker-api.service > /dev/null <<'EOF'
            [Unit]
            Description=WebTracker HTTP API
            After=network.target redis-server.service
            Wants=redis-server.service
            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/webtracker
            ExecStart=/opt/webtracker/bot --mode=api
            Restart=always
            RestartSec=10
            StartLimitIntervalSec=300
            StartLimitBurst=5
            EnvironmentFile=/opt/webtracker/.env
            [Install]
            WantedBy=multi-user.target
            EOF

            echo "=== Updating bot service ==="
            sudo tee /etc/systemd/system/webtracker-bot.service > /dev/null <<'EOF'
            [Unit]
            Description=WebTracker WhatsApp Bot
            After=network.target redis-server.service
            Wants=redis-server.service
            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/webtracker
            ExecStart=/opt/webtracker/bot --mode=bot
            Restart=always
            RestartSec=10
            StartLimitIntervalSec=300
            StartLimitBurst=5
            EnvironmentFile=/opt/webtracker/.env
            [Install]
            WantedBy=multi-user.target
            EOF

            echo "=== Reloading systemd ==="
            sudo systemctl daemon-reload
            sudo systemctl enable webtracker-api.service
            sudo systemctl enable webtracker-bot.service

            echo "=== Killing any process on port 8080 ==="
            sudo fuser -k 8080/tcp 2>/dev/null || true
            sleep 1

            echo "=== Starting bot (mode=bot) ==="
            sudo systemctl restart webtracker-bot.service
            sleep 3

            echo "=== Starting API (mode=api) ==="
            sudo systemctl restart webtracker-api.service
            sleep 2

            echo "=== Status ==="
            echo "--- API ---"
            sudo systemctl status webtracker-api.service --no-pager 2>&1 | head -5
            echo "--- Bot ---"
            sudo systemctl status webtracker-bot.service --no-pager 2>&1 | head -5
