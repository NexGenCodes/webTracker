name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Linux binary
        working-directory: backend
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bot ./cmd/server/
          ls -lh bot

      - name: Save SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload and deploy via SSH
        run: |
          set -e
          # Upload binary via tar piped through SSH
          tar czf - -C backend bot | ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo tar xzf - -C /opt/webtracker && sudo chmod +x /opt/webtracker/bot"

          # Run deploy commands
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'set -e
            echo "=== Creating API service ==="
            sudo tee /etc/systemd/system/webtracker-api.service > /dev/null <<'\''SERVICEEOF'\''
            [Unit]
            Description=WebTracker HTTP API
            After=network.target redis-server.service
            Wants=redis-server.service
            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/webtracker
            ExecStart=/opt/webtracker/bot --mode=api
            Restart=always
            RestartSec=10
            StartLimitIntervalSec=300
            StartLimitBurst=5
            EnvironmentFile=/opt/webtracker/.env
            [Install]
            WantedBy=multi-user.target
            SERVICEEOF

            echo "=== Updating bot service ==="
            sudo tee /etc/systemd/system/webtracker-bot.service > /dev/null <<'\''SERVICEEOF'\''
            [Unit]
            Description=WebTracker WhatsApp Bot
            After=network.target redis-server.service
            Wants=redis-server.service
            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/webtracker
            ExecStart=/opt/webtracker/bot --mode=bot
            Restart=always
            RestartSec=10
            StartLimitIntervalSec=300
            StartLimitBurst=5
            EnvironmentFile=/opt/webtracker/.env
            [Install]
            WantedBy=multi-user.target
            SERVICEEOF

            echo "=== Reloading systemd ==="
            sudo systemctl daemon-reload
            sudo systemctl enable webtracker-api.service
            sudo systemctl enable webtracker-bot.service

            echo "=== Killing anything on port 8080 ==="
            sudo fuser -k 8080/tcp 2>/dev/null || true
            sleep 1

            echo "=== Starting bot (mode=bot) ==="
            sudo systemctl restart webtracker-bot.service
            sleep 3

            echo "=== Starting API (mode=api) ==="
            sudo systemctl restart webtracker-api.service
            sleep 2

            echo "=== Status ==="
            echo "--- API ---"
            sudo systemctl status webtracker-api.service --no-pager 2>&1 | head -5
            echo "--- Bot ---"
            sudo systemctl status webtracker-bot.service --no-pager 2>&1 | head -5
            echo "--- Port 8080 ---"
            sudo ss -tlnp | grep 8080 || echo "NOT LISTENING"
            '
